<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="contener">
    <div class="apply_box">
      <h1>Job Application <span class="title_small">(Web)</span></h1>
      <form action="">
        <div class="form_contener">

          <div class="form_control">
            <label for="first_name">First Name </label>
            <input type="text" id="first_name" name="first_name" placeholder="enter first name.....">
          </div>


          <div class="form_control">
            <label for="last_name">Last Name </label>
            <input type="text" id="last_name" name="last_name" placeholder="enter last name.....">


            <div class="form_control">
              <label for="email">E-Mail </label>
              <input type="email" id="e-mail" name="first_name" placeholder="enter e-mail.....">
          </div>

          <div class="form_control">
            <label for="job_roll">Job-Roll </label>
            <select id="job_roll" name="job_roll" >
             <option value="">Select Job Roll</option>
             <option value="frontend"> Frontend Developer</option>
             <option value="backend"> Backend Developer</option>
             <option value="fullstack">Fullstack Developer </option>
             <option value="ui_ux"> UI UX Developer</option>
            </select>
        </div>

        <div class="textarea_control">
          <label for="address">Address </label>
          <textarea name="address" id="address" rows="4" cols="50" placeholder="enter address...."></textarea>
      </div>
      

      <div class="form_control">
        <label for="city">City </label>
        <input type="text" id="city" name="city" placeholder="enter city name.....">
      </div>

        <div class="form_control">
          <label for="pincode">Pincode </label>
          <input type="number" id="pincode" name="pincode" placeholder="enter pincode.....">
        </div>
  
          <div class="form_control">
            <label for="date">Date </label>
            <input value="2025-04-02" type="date" id="date" name="date">
          </div>

            <div class="form_control">
              <label for="upload">upload your CV </label>
              <input type="file" id="upload" name="upload">
            </div>
  
              
    

        </div>
        <div class="button_container">
          <button type="submit">Apply Now</button>
        </div>
      </form>
    </div>
   </div>
</body>
</html>
